name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download the background-removal model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx" -OutFile models/u2net_human_seg.onnx
          $hash = (Get-FileHash models/u2net_human_seg.onnx -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "01eb6a29a5c4d8edb30b56adad9bb3a2a0535338e480724a213e0acfd2d1c73c") { throw "Model checksum mismatch: $hash" }

      - name: Build the app
        run: pyinstaller --noconfirm --windowed --name FlipFormat --icon assets/flipformat.ico --add-data "assets;assets" --add-data "models;models" --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all pillow_avif --collect-all onnxruntime flipformat.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not ($v -match '^\d')) { $v = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FlipFormat-Setup
          path: installer/FlipFormat-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/FlipFormat-Setup.exe
