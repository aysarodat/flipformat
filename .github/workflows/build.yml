name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the app
        run: pyinstaller --noconfirm --windowed --name FlipFormat --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all pillow_avif flipformat.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not ($v -match '^\d')) { $v = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FlipFormat-Setup
          path: installer/FlipFormat-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/FlipFormat-Setup.exe
